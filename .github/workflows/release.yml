name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          version=${GITHUB_REF_NAME#v}
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          [[ $version =~ $semver ]] || { echo "::error::$GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]"; exit 1; }

  check:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: $/.github/actions/setup
      - id: gradle
        run: ./gradlew check -Pakki.version="${GITHUB_REF_NAME#v}" --stacktrace
      - name: Upload test reports
        if: ${{ !cancelled() && steps.gradle.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.job }}-reports
          path: '**/build/reports/tests'

  lincheck:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: $/.github/actions/setup
      - id: gradle
        run: ./gradlew lincheck -Pakki.version="${GITHUB_REF_NAME#v}" --max-workers=1 --stacktrace
      - name: Upload test reports
        if: ${{ !cancelled() && steps.gradle.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.job }}-reports
          path: '**/build/reports/tests'

  maven-central:
    needs: [check, lincheck]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: $/.github/actions/setup
      - run: ./gradlew publishAndReleaseToMavenCentral -Pakki.version="${GITHUB_REF_NAME#v}" --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralDeploymentValidation: PUBLISHED
          ORG_GRADLE_PROJECT_SONATYPE_CLOSE_TIMEOUT_SECONDS: 3600
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  gradle-plugin-portal:
    needs: maven-central
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: $/.github/actions/setup
      - run: ./gradlew :akki-gradle:publishPlugins -Pakki.version="${GITHUB_REF_NAME#v}" --stacktrace
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

  github-release:
    needs: gradle-plugin-portal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          exclude=()
          [[ $PRERELEASE == true ]] || exclude=(--exclude 'v*-*')
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "${exclude[@]}" "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --format='- %s' ${previous:+$previous..}"$GITHUB_REF_NAME" |
            perl -pe 's/(`+).*?\1|(?<![\w`])@[\w-]+/$1 ? $& : "`$&`"/ge' > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag \
            --prerelease="$PRERELEASE"
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}

  release-branch:
    needs: gradle-plugin-portal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/release/${GITHUB_REF_NAME#v}" -f sha="$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
