name: Check out and set up Gradle
description: Checks out the repository, installs JDK 17 and 25 and sets up Gradle; actions/cache keeps the Gradle User Home

inputs:
  cache:
    description: "'read-write' restores the Gradle User Home and saves it when the job succeeds, 'read-only' only restores it, 'none' skips it"
    default: none

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - id: gradle-home
      shell: bash
      run: |
        case $CACHE in
          none | read-only | read-write) ;;
          *) echo "::error::Unknown cache mode '$CACHE', expected none, read-only or read-write"; exit 1 ;;
        esac
        if [[ $GITHUB_REF_TYPE == tag && $CACHE != none ]]; then
          echo "::error::Tags build without the Gradle cache, got cache mode '$CACHE'"
          exit 1
        fi
        cat >> "$GITHUB_OUTPUT" <<EOF
        path<<PATHS
        ~/.gradle/caches
        ~/.gradle/wrapper
        PATHS
        key=gradle-$RUNNER_OS-$HASH
        restore-keys=gradle-$RUNNER_OS-
        EOF
      env:
        CACHE: ${{ inputs.cache }}
        HASH: ${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', 'gradle/*.versions.toml') }}
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: |
          17
          25
    - if: inputs.cache == 'read-write'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.gradle-home.outputs.path }}
        key: ${{ steps.gradle-home.outputs.key }}
        restore-keys: ${{ steps.gradle-home.outputs.restore-keys }}
    - if: inputs.cache == 'read-only'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.gradle-home.outputs.path }}
        key: ${{ steps.gradle-home.outputs.key }}
        restore-keys: ${{ steps.gradle-home.outputs.restore-keys }}
    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-disabled: true
        cache-provider: basic
